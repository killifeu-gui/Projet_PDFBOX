<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PDF Tools</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            border-left: 5px solid #3498db;
            padding-left: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        pre {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>📄 PDF Tools</h1>
    <p>Gestion intelligente de vos fichiers PDF</p>
</header>

<div class="container">

    <div class="card">
        <h2>Fusion de PDF</h2>
        <form id="fusionForm">
            <input type="file" id="pdf1" required>
            <input type="file" id="pdf2" required>
            <button>Fusionner</button>
        </form>
    </div>

    <div class="card">
        <h2>Découpage PDF</h2>
        <form id="decoupageForm">
            <input type="file" id="pdfDecoupage" required>
            <input type="number" id="debut" placeholder="Page début">
            <input type="number" id="fin" placeholder="Page fin">
            <button>Découper</button>
        </form>
    </div>

    <div class="card">
        <h2>Extraction de texte</h2>
        <form id="extractionTexteForm">
            <input type="file" id="pdfExtractionTexte" required>
            <button>Extraire texte</button>
        </form>
        <pre id="texteExtrait"></pre>
    </div>

    <div class="card">
        <h2>Création PDF</h2>
        <form id="creationForm">
            <textarea id="texte" rows="5" placeholder="Écrire ici..."></textarea>
            <button>Créer PDF</button>
        </form>
    </div>

</div>

<script>
// TON JAVASCRIPT RESTE IDENTIQUE (tu ne changes rien)
</script>

</body>
</html>
